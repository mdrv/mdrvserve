# Generated by lhg v0.1.0-dirty
# Publishes to crates.io on tag push (v*.*.*). Verifies the tag matches the
# version declared in Cargo.toml before publishing.
#
# Setup:
#   1. Create a token at https://crates.io/settings/tokens (scope: publish-new + publish-update).
#   2. Add it as a repository secret named CARGO_REGISTRY_TOKEN
#      (Settings → Secrets and variables → Actions → New repository secret).
name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Batch-pushed tags must never race on crates.io: a higher version landing
# first makes every lower `cargo publish` fail. Serialize runs (queue, do not
# cancel an in-flight publish).
concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches Cargo.toml version
        run: |
          PKG_VERSION="v$(grep -m1 '^version' Cargo.toml \
            | sed 's/^version *= *"\(.*\)"/\1/')"
          TAG_VERSION="${GITHUB_REF_NAME}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "tag $TAG_VERSION does not match Cargo.toml version $PKG_VERSION"
            exit 1
          fi
          echo "version $TAG_VERSION matches"

      - name: Publish only if newest and unpublished
        id: latest
        run: |
          git fetch --tags --force --quiet
          NEWEST=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n 1)
          if [ "$NEWEST" != "${GITHUB_REF_NAME}" ]; then
            echo "is_newest=false" >> "$GITHUB_OUTPUT"
            echo "Skipping crates.io publish: $GITHUB_REF_NAME is superseded by $NEWEST"
            exit 0
          fi
          # crates.io rejects bare curl's User-Agent, and grep on an empty
          # body would fall through to a doomed publish; fail loudly instead
          RESP=$(curl -fsSL -H 'User-Agent: mdrvserve-ci (github.com/mdrv/mdrvserve)' \
            "https://crates.io/api/v1/crates/mdrvserve") || {
            echo "crates.io API unreachable; refusing to publish blind"
            exit 1
          }
          if printf '%s' "$RESP" | grep -q "\"num\":\"${GITHUB_REF_NAME#v}\""; then
            echo "is_newest=false" >> "$GITHUB_OUTPUT"
            echo "Skipping crates.io publish: ${GITHUB_REF_NAME#v} is already published"
          else
            echo "is_newest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.latest.outputs.is_newest == 'true'
        run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
