# Generated by lhg v0.1.0-dirty
# Cross-platform release: builds binaries for configured targets and publishes
# a GitHub Release with notes from docs/changelogs/ YAML-codeblock entries.
#
# Setup:
#   - No extra secrets needed (uses the default GITHUB_TOKEN).
#   - Ensure docs/changelogs/ has an entry with 'mid: v<version>' for each tag.
#   - Control targets via [ci] release_targets in .lhg/config.toml.
#   - If your binary is behind a feature gate (e.g. required-features = ["cli"]),
#     set [ci] release_build in .lhg/config.toml:
#       release_build = "cargo build --release --features cli --target {target}"
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          - target: armv7-unknown-linux-musleabihf
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-compilation tools
        if: contains(matrix.target, 'armv7')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf
      - name: Install musl tools
        if: contains(matrix.target, 'musl') && startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Configure armv7 cross-linker
        if: contains(matrix.target, 'armv7')
        run: |
          mkdir -p .cargo
          printf '[target.armv7-unknown-linux-musleabihf]\nlinker = "arm-linux-gnueabihf-gcc"\n' >> .cargo/config.toml
      - uses: extractions/setup-just@v4
      - name: Build
        shell: bash
        run: |
          just build-ci ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          BIN_NAME=$(grep -m1 '^name' Cargo.toml | sed 's/^name *= *"\(.*\)"/\1/')
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/$BIN_NAME.exe" "dist/$BIN_NAME-v$VERSION-${{ matrix.target }}.exe"
          else
            cp "target/${{ matrix.target }}/release/$BIN_NAME" "dist/$BIN_NAME-v$VERSION-${{ matrix.target }}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Extract release notes for ${{ github.ref_name }}
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          SERIES_FILE="$(grep -rl "^mid: ${TAG}" docs/changelogs/ 2>/dev/null | head -1 || true)"
          if [ -z "$SERIES_FILE" ]; then
            echo "::error::No changelog entry with 'mid: ${TAG}' in docs/changelogs/"
            exit 1
          fi
          TITLE=$(awk -v t="${TAG}" '
            /^```yaml$/ { y=1; next }
            /^```$/ && y { y=0; if(f) b=1; next }
            y && $0=="mid: "t { f=1; next }
            b && /^## / { sub(/^## */,""); sub(/^v[0-9][0-9.]* — /,""); print; exit }
          ' "$SERIES_FILE")
          BODY_FILE="$(mktemp)"
          awk -v t="${TAG}" '
            /^```yaml$/ { y=1; next }
            /^```$/ && y { y=0; if(f) b=1; next }
            y && $0=="mid: "t { f=1; next }
            b && /^## / { next }
            b && /^```yaml$/ { exit }
            b && /^---$/ { exit }
            b { print }
          ' "$SERIES_FILE" > "$BODY_FILE"
          if [ ! -s "$BODY_FILE" ]; then
            echo "::error::Changelog entry for ${TAG} has no body"
            exit 1
          fi
          NAME="${TAG}"
          [ -n "$TITLE" ] && NAME="${TAG} — ${TITLE}"
          {
            echo "name=${NAME}"
            echo "body_file=${BODY_FILE}"
          } >> "$GITHUB_OUTPUT"
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.notes.outputs.name }}
          body_path: ${{ steps.notes.outputs.body_file }}
          fail_on_unmatched_body_path: true
          files: dist/*
