# Reworked for v267.5.0 (was lhg-generated). Cross-platform release: builds
# each target, packages checksummed archives, and publishes a GitHub Release
# with notes from docs/changelogs/ YAML-codeblock entries plus
# install.sh / install.ps1 and a SHA256SUMS.txt.
#
# Notes:
#   - Linux targets are musl (static). aarch64 builds natively on the ARM
#     runner; armv7 cross-links via gcc-arm-linux-gnueabihf (the binary only
#     needs kernel syscalls, so the hard-float ABI is fine on entware/ASUS).
#   - Windows zip creation must use the bsdtar at System32: the GNU tar that
#     `tar` resolves to in git-bash ignores the .zip suffix and silently
#     writes a plain tar. The PK magic is asserted before upload.
#   - docs/changelogs/ must contain an entry with 'mid: v<version>' for each
#     tag; the release job extracts title and body from it.
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: ubuntu-latest, target: armv7-unknown-linux-musleabihf }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Check version sync (tag == Cargo.toml)
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$V\"" Cargo.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl') && startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Configure armv7 cross-linker
        if: contains(matrix.target, 'armv7')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf
          mkdir -p .cargo
          printf '[target.armv7-unknown-linux-musleabihf]\nlinker = "arm-linux-gnueabihf-gcc"\n' >> .cargo/config.toml
      - uses: oven-sh/setup-bun@v2
      - uses: extractions/setup-just@v4
      - name: Build
        shell: bash
        run: |
          just build-ci ${{ matrix.target }}
      - name: Smoke the binary
        shell: bash
        run: |
          EXE=""
          case ${{ matrix.target }} in *windows*) EXE=.exe ;; esac
          target/${{ matrix.target }}/release/mdrvserve$EXE --version
      - name: Package
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          T=${{ matrix.target }}
          EXE=""
          case $T in *windows*) EXE=.exe ;; esac
          B=target/$T/release/mdrvserve$EXE
          D=mdrvserve-v$V-$T
          mkdir -p pkg/$D
          cp $B pkg/$D/mdrvserve$EXE
          cp README.md LICENSE pkg/$D/
          if [ -n "$EXE" ]; then
            # bash's tar on windows runners is GNU tar: its -a ignores the
            # .zip suffix and silently writes a plain tar - use the bsdtar
            # at System32 and assert the zip magic before upload
            /c/Windows/System32/tar.exe -a -cf $D.zip -C pkg $D
            [ "$(head -c2 $D.zip)" = PK ] || { echo "not a zip"; exit 1; }
          else
            tar -czf $D.tar.gz -C pkg $D
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: |
            mdrvserve-v*.tar.gz
            mdrvserve-v*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Extract release notes for ${{ github.ref_name }}
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          SERIES_FILE="$(grep -rl "^mid: ${TAG}" docs/changelogs/ 2>/dev/null | head -1 || true)"
          if [ -z "$SERIES_FILE" ]; then
            echo "::error::No changelog entry with 'mid: ${TAG}' in docs/changelogs/"
            exit 1
          fi
          TITLE=$(awk -v t="${TAG}" '
            /^```yaml$/ { y=1; next }
            /^```$/ && y { y=0; if(f) b=1; next }
            y && $0=="mid: "t { f=1; next }
            b && /^## / { sub(/^## */,""); sub(/^v[0-9][0-9.]* — /,""); print; exit }
          ' "$SERIES_FILE")
          BODY_FILE="$(mktemp)"
          awk -v t="${TAG}" '
            /^```yaml$/ { y=1; next }
            /^```$/ && y { y=0; if(f) b=1; next }
            y && $0=="mid: "t { f=1; next }
            b && /^## / { next }
            b && /^```yaml$/ { exit }
            b && /^---$/ { exit }
            b { print }
          ' "$SERIES_FILE" > "$BODY_FILE"
          if [ ! -s "$BODY_FILE" ]; then
            echo "::error::Changelog entry for ${TAG} has no body"
            exit 1
          fi
          NAME="${TAG}"
          [ -n "$TITLE" ] && NAME="${TAG} — ${TITLE}"
          {
            echo "name=${NAME}"
            echo "body_file=${BODY_FILE}"
          } >> "$GITHUB_OUTPUT"

      - name: Attach installers + checksums
        run: |
          cp install.sh install.ps1 dist/
          cd dist
          ls | grep -v '^SHA256SUMS.txt$' | xargs sha256sum > SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.notes.outputs.name }}
          body_path: ${{ steps.notes.outputs.body_file }}
          fail_on_unmatched_body_path: true
          files: dist/*
