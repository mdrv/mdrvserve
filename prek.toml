# prek.toml — Generated by lhg vv0.1.0-dirty
# Do not edit hook entries manually; re-run `lhg init` to update.
# To customise, add your own [[repos]] blocks below.

minimum_prek_version = "0.4.0"
fail_fast = false

default_install_hook_types = ["pre-commit", "commit-msg", "pre-push", "post-commit"]

[[repos]]
repo = "local"
hooks = [
  # ── commit-msg: version prefix validation + file sync ─────────────────────────────────────────‍═───
  {
    id = "lhg-commit-msg",
    name = "lhg: version prefix + file sync",
    entry = "lhg hook commit-msg",
    language = "system",
    stages = ["commit-msg"],
    always_run = true,
    pass_filenames = true,
  },
  # ── pre-push: version consistency across all files ─────────────────────────────────────────‍═───
  {
    id = "lhg-version-check",
    name = "lhg: version consistency",
    entry = "lhg hook pre-push",
    language = "system",
    stages = ["pre-push"],
    always_run = true,
    pass_filenames = false,
  },
  # ── post-commit: auto-tag + auto-changelog ─────────────────────────────────────────‍═───
  {
    id = "lhg-post-commit",
    name = "lhg: auto-tag + changelog",
    entry = "lhg hook post-commit",
    language = "system",
    stages = ["post-commit"],
    always_run = true,
    pass_filenames = false,
  },
  # ── pre-commit: file-size guard ─────────────────────────────────────────
  {
    id = "lhg-filesize",
    name = "lhg: file size guard",
    entry = "lhg hook filesize",
    language = "system",
    stages = ["pre-commit"],
    types = ["file"],
    pass_filenames = true,
  },
  # ── pre-commit: secret scanner ─────────────────────────────────────────
  {
    id = "lhg-secret-scan",
    name = "lhg: secret scanner",
    entry = "lhg hook secret-scan",
    language = "system",
    stages = ["pre-commit"],
    types = ["file"],
    pass_filenames = true,
  },
]
